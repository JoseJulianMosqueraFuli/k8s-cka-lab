apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api-irsa
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api-irsa
  template:
    metadata:
      labels:
        app: identity-api-irsa
    spec:
      serviceAccountName: identity-api-irsa
      containers:
        - name: api
          image: <TU_IMAGE>
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # NO hace falta declarar AWS_REGION: el mutating webhook de EKS inyecta
            # AWS_REGION, AWS_DEFAULT_REGION, AWS_STS_REGIONAL_ENDPOINTS, AWS_ROLE_ARN
            # y AWS_WEB_IDENTITY_TOKEN_FILE al detectar la anotacion del SA.
            # (Verificado en 1.36 / Auto Mode con:
            #  kubectl get pod -n apps -l app=identity-api-irsa \
            #    -o jsonpath='{range .items[0].spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}')
            # El "Missing Region" del lab 04 era otro camino: hostNetwork + IMDS,
            # sin webhook de por medio, asi que nadie ponia la region.
            - name: S3_BUCKET
              value: <TU_BUCKET>
            - name: S3_KEY
              value: lab-data/secret.txt
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
