apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api-podid
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api-podid
  template:
    metadata:
      labels:
        app: identity-api-podid
    spec:
      serviceAccountName: identity-api-podid
      containers:
        - name: api
          image: <TU_IMAGE>
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Tampoco hace falta AWS_REGION. Pod Identity inyecta:
            #   AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.23/v1/credentials
            #   AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE=/var/run/secrets/pods.eks.amazonaws.com/...
            #   AWS_REGION, AWS_DEFAULT_REGION, AWS_STS_REGIONAL_ENDPOINTS
            # Verificado en 1.36 / Auto Mode. Compara con deploy-irsa.yaml: alli el
            # SDK lee un TOKEN de disco y lo cambia en STS; aqui consulta una URL
            # link-local del agente. Mismo resultado, mecanismos distintos.
            - name: S3_BUCKET
              value: <TU_BUCKET>
            - name: S3_KEY
              value: lab-data/secret.txt
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
