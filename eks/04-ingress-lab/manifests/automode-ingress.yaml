# Ingress para EKS Auto Mode. Diferencias con el ingress.yaml standalone:
#  - NO lleva la anotacion `scheme` (eso vive en el IngressClassParams).
#  - Usa el IngressClass `alb` que definimos en automode-ingressclass.yaml.
#  - Las anotaciones `target-type` y `healthcheck-path` SI siguen soportadas.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-api
  namespace: apps
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /identity
            pathType: Prefix
            backend:
              service:
                name: identity-api
                port:
                  number: 80
          - path: /s3
            pathType: Prefix
            backend:
              service:
                name: identity-api
                port:
                  number: 80
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: identity-api
                port:
                  number: 80
