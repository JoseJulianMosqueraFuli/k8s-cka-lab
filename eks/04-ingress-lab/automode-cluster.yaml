apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: automode-lab-cluster
  region: us-east-1
  # Fijamos la version. Si se omite, eksctl usa su default (en nuestra corrida
  # fue 1.34). La dejamos en 1.36 para alinear con el resto de los labs.
  version: "1.36"
autoModeConfig:
  # Con enabled: true, eksctl crea la VPC (con subnets ya taggeadas para Auto
  # Mode), el node role, y el cluster con compute/storage/load-balancing
  # integrados en una sola pasada.
  enabled: true
